<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLULU - Menu Bar</title>
    <link rel="shortcut icon" href="img/hoshinologo.png" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gradient-to-br from-[#0f0c1b] to-[#FFD1DC] min-h-screen flex items-center justify-center font-sans p-4 md:p-8 selection:bg-pink-200">

    <!-- Decorative Background Elements for Depth -->
    <div class="absolute top-10 left-10 w-32 h-32 bg-pink-300 rounded-full mix-blend-multiply filter blur-xl opacity-40 animate-pulse"></div>
    <div class="absolute bottom-10 right-10 w-44 h-44 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl opacity-40 animate-pulse delay-1000"></div>

    <!-- Main Dynamic Card Container -->
    <div class="bg-white/40 backdrop-blur-xl border border-white/60 shadow-2xl rounded-3xl p-6 md:p-12 max-w-5xl w-full flex flex-col md:flex-row items-center gap-8 md:gap-12 relative z-10">
        
        <!-- Left Side: Header & Navigation Buttons -->
        <div class="w-full md:w-1/2 flex flex-col justify-center text-center md:text-left">
            <span class="text-pink-500 font-bold tracking-widest text-sm uppercase mb-2 block">Welcome to Solulu</span>
            <h3 class="text-4xl md:text-5xl lg:text-6xl font-black tracking-tight text-gray-800 leading-tight mb-8">
                Find Your <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-rose-400">Vibe ✨</span>
            </h3>
            
            <!-- Navigation Menu -->
            <div class="flex flex-col gap-4 max-w-md mx-auto md:mx-0 w-full">
                
                <!-- Chat Button -->
                <a href="chat.html" class="group flex items-center justify-between bg-white/80 text-gray-800 px-6 py-4 rounded-2xl shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-0.5 border border-white">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-pink-100 flex items-center justify-center group-hover:bg-pink-500 transition-colors duration-300">
                            <i class="fa-solid fa-comments text-pink-500 group-hover:text-white transition-colors duration-300 text-lg"></i>
                        </div>
                        <span class="font-semibold text-lg tracking-wide text-gray-700">Chat Lounge</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-400 opacity-0 group-hover:opacity-100 group-hover:translate-x-1 transition-all duration-300"></i>
                </a>

                <!-- Game Button -->
                <a href="game.html" class="group flex items-center justify-between bg-white/80 text-gray-800 px-6 py-4 rounded-2xl shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-0.5 border border-white">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-pink-100 flex items-center justify-center group-hover:bg-pink-500 transition-colors duration-300">
                            <i class="fa-solid fa-gamepad text-pink-500 group-hover:text-white transition-colors duration-300 text-lg"></i>
                        </div>
                        <span class="font-semibold text-lg tracking-wide text-gray-700">Game Room</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-400 opacity-0 group-hover:opacity-100 group-hover:translate-x-1 transition-all duration-300"></i>
                </a>

                <!-- Video Call Button -->
                <a href="videocall.html" class="group flex items-center justify-between bg-white/80 text-gray-800 px-6 py-4 rounded-2xl shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-0.5 border border-white">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-pink-100 flex items-center justify-center group-hover:bg-pink-500 transition-colors duration-300">
                            <i class="fa-solid fa-video text-pink-500 group-hover:text-white transition-colors duration-300 text-lg"></i>
                        </div>
                        <span class="font-semibold text-lg tracking-wide text-gray-700">Video Call</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-400 opacity-0 group-hover:opacity-100 group-hover:translate-x-1 transition-all duration-300"></i>
                </a>
                
            </div>
        </div>

        <!-- Right Side: Hero Visual Frame -->
        <div class="w-full md:w-1/2 flex justify-center items-center">
            <div class="relative w-full max-w-sm md:max-w-md aspect-square rounded-3xl overflow-hidden bg-gradient-to-tr from-rose-200 to-pink-100 p-4 shadow-inner group">
                <!-- Inner Soft Glow/Border effect -->
                <div class="absolute inset-0 border-[6px] border-white/40 rounded-3xl pointer-events-none z-10"></div>
                <!-- Main Image Asset -->
                <img id="hoshinoImg" src="img/bubu1.jpg" alt="Vibe Illustration"
                     class="w-full h-full object-cover rounded-2xl shadow-md transform group-hover:scale-105 transition-transform duration-700 ease-out">
            </div>
        </div>

    </div>
</body>

</html>
