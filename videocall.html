<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLULU - AI Video Call</title>
     <link rel="shortcut icon" href="img\hoshinologo.png" type="image/x-icon" />
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #121212;
            color: white;
        }

        .video-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        video {
            width: 45%, max-width: 500px;
            border-radius: 10px;
            background: #222;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>AI Video Call Session</h1>
    <div class="video-container">
        <div>
            <h3>You</h3>
            <video id="localVideo" autoplay playsinline></video>
        </div>
        <div>
            <h3>AI Avatar / Visuals</h3>
            <audio id="aiAudio" autoplay></audio>
            <video id="aiVideo" autoplay playsinline>
                <div class="flex flex-col justify-center items-center pointer-events-none z-0 mb-6">
                    <img id="hoshinoImg" src="img\hoshinowall.jpg"
                        class="max-h-[50vh] object-contain drop-shadow-[0_0_20px_rgba(244,63,94,0.2)]">
                </div>
            </video>
        </div>
    </div>
    <br>
    <button id="startCall">Start Call</button>

    <script src="app.js"></script>
</body>

</html>
