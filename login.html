<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delulu World - Information Entry</title>
  <link rel="shortcut icon" href="img/hoshinologo.png" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body
  class="bg-gradient-to-br from-[#FFF5F7] via-[#F9E4E8] to-[#F3D1D7] min-h-screen text-gray-800 flex items-center justify-center p-4 md:p-8 font-sans antialiased selection:bg-pink-200">

  <!-- Main Container -->
  <div
    class="bg-white/70 backdrop-blur-lg rounded-3xl shadow-xl border border-white/80 overflow-hidden max-w-4xl w-full grid grid-cols-1 md:grid-cols-2">

    <!-- Left Panel: Hero Graphic -->
    <div
      class="relative bg-gradient-to-tr from-pink-400 to-rose-300 hidden md:flex flex-col justify-between p-8 text-white overflow-hidden">
      <!-- Decorative background blur blobs -->
      <div class="absolute -top-10 -left-10 w-40 h-40 bg-white/20 rounded-full blur-2xl"></div>
      <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-white/20 rounded-full blur-2xl"></div>

      <!-- Brand Header -->
      <div class="z-10 flex items-center gap-2">
        <i class="fa-solid fa-sparkles text-xl"></i>
        <span class="font-bold tracking-wider text-sm uppercase">Solulu Platform</span>
      </div>

      <!-- Center Image/Graphic Showcase -->
      <div class="z-10 my-auto flex flex-col items-center justify-center text-center px-4">
        <!-- Placeholder for your application image asset -->
        <img src="img/hoshinologo.png" alt="Delulu World Portal"
          class="max-h-[200px] object-contain drop-shadow-[0_10px_20px_rgba(0,0,0,0.1)] mb-6 transform hover:scale-105 transition-transform duration-500"
          onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop'">

        <h3 class="text-2xl font-black mb-2 tracking-wide">Step Into Reality</h3>
        <p class="text-white/80 text-sm leading-relaxed max-w-xs">
          Claim your unique avatar profile, unlock private lobbies, and connect with players across the network.
        </p>
      </div>

      <!-- Footer Sign-off -->
      <div class="z-10 text-xs text-white/60">
        &copy; 2026 Delulu World. All rights reserved.
      </div>
    </div>

    <!-- Right Panel: Form Content -->
    <div class="p-8 md:p-12 flex flex-col justify-center relative">
      <!-- Simple Back Navigation Link -->
      <a href="index.html"
        class="absolute top-6 right-6 text-gray-400 hover:text-pink-500 transition-colors text-sm font-medium flex items-center gap-1 group">
        <i class="fa-solid fa-arrow-left transform group-hover:-translate-x-0.5 transition-transform"></i> Exit
      </a>

      <div class="mb-8">
        <h2 class="text-3xl font-black text-gray-900 tracking-tight mb-2">Join Delulu World <span
            class="text-pink-500">✨</span></h2>
        <p class="text-gray-500 text-sm">Please register your core account information below to gain lobby access.</p>
      </div>

      <form id="loginForm" class="space-y-5">
        <!-- Input: Name -->
        <div>
          <label for="name" class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Full
            Name</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-regular fa-user"></i>
            </span>
            <input type="text" id="name" placeholder="John Doe" required
              class="w-full pl-10 pr-4 py-3 bg-white/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400/40 focus:border-pink-400 transition-all font-medium text-gray-800 placeholder-gray-400">
          </div>
        </div>

        <div>
          <label for="name" class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">email-id
            <email-id></email-id></label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-regular fa-user"></i>
            </span>
            <input type="text" id="name" placeholder="John Doe" required
              class="w-full pl-10 pr-4 py-3 bg-white/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400/40 focus:border-pink-400 transition-all font-medium text-gray-800 placeholder-gray-400">
          </div>
        </div>

        <!-- Input: Age -->
        <div>
          <label for="age" class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Age</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-regular fa-calendar-days"></i>
            </span>
            <input type="number" id="age" min="1" max="120" placeholder="21" required
              class="w-full pl-10 pr-4 py-3 bg-white/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400/40 focus:border-pink-400 transition-all font-medium text-gray-800 placeholder-gray-400">
          </div>
        </div>

        <!-- Input: Address -->
        <div>
          <label for="address"
            class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Address</label>
          <div class="relative">
            <span class="absolute top-3 left-3 text-gray-400">
              <i class="fa-regular fa-location-dot"></i>
            </span>
            <textarea id="address" placeholder="Enter full residential or billing address..." required
              class="w-full pl-10 pr-4 py-3 bg-white/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400/40 focus:border-pink-400 transition-all font-medium text-gray-800 placeholder-gray-400 min-h-[90px] resize-none"></textarea>
          </div>
        </div>

        <!-- Action Submit Button -->
        <button type="submit"
          class="w-full bg-gradient-to-r from-pink-500 to-rose-400 hover:from-pink-600 hover:to-rose-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-md hover:shadow-lg transition-all duration-200 tracking-wide flex items-center justify-center gap-2 transform active:scale-[0.98]">
          <span>Submit Details</span>
          <i class="fa-solid fa-arrow-right text-xs opacity-80"></i>
        </button>
      </form>

      <!-- Feedback Status Box Component -->
      <div id="messageBox" class="mt-4 p-4 rounded-xl text-sm font-medium border text-center hidden animate-fade-in">
      </div>
    </div>
  </div>

  <!-- Main JavaScript Logic -->
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault(); // Lock down explicit native form refreshing animations

      const name = document.getElementById('name').value;
      const age = document.getElementById('age').value;
      const address = document.getElementById('address').value;
      const messageBox = document.getElementById('messageBox');

      try {
        // Dispatch structured state clean to our target API controller
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, age, address })
        });

        const data = await response.json();

        if (data.success) {
          messageBox.className = "mt-4 p-4 rounded-xl text-sm font-medium border text-center bg-green-50 border-green-200 text-green-700 block";
          messageBox.innerHTML = `<i class="fa-solid fa-circle-check mr-1"></i> Welcome ${data.user.name}! Saved successfully.`;

          // Reset forms state
          document.getElementById('loginForm').reset();

          // Hand off routing natively via JavaScript instead of broken internal <a> tags
          setTimeout(() => {
            window.location.href = "front.html";
          }, 1500);

        } else {
          throw new Error(data.error || "Submission failed");
        }
      } catch (err) {
        messageBox.className = "mt-4 p-4 rounded-xl text-sm font-medium border text-center bg-red-50 border-red-200 text-red-700 block";
        messageBox.innerHTML = `<i class="fa-solid fa-circle-exclamation mr-1"></i> Error: ${err.message}`;
      }
    });
  </script>

</body>

</html>
